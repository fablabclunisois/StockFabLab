<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Stock FabLab Clunisois</title>
<style>
  :root{--ok:#1a9a52;--low:#d98a00;--out:#d23b3b}
  :root,:root[data-mode=light]{color-scheme:light;--bg:#f4f6f9;--card:#fff;--text:#1c2430;--muted:#6a7686;--line:#e1e6ee;
    --accent:#1f6feb;--on-accent:#fff;--head:#1f6feb;--on-head:#fff;--hi:#f2994a}
  :root[data-mode=dark]{color-scheme:dark;--bg:#10151c;--card:#19212b;--text:#e8edf3;--muted:#92a0b2;--line:#2a3544;
    --accent:#58a6ff;--on-accent:#0b1220;--head:#16263f;--on-head:#fff;--hi:#f2994a}
  /* Arts et Métiers : violet #80276C et orange #FFA300 (charte graphique 2023) */
  :root[data-palette=am][data-mode=light]{--accent:#80276c;--on-accent:#fff;--head:#80276c;--on-head:#fff;--hi:#ffa300}
  :root[data-palette=am][data-mode=dark]{--accent:#e08acb;--on-accent:#1a0a16;--head:#3a1632;--on-head:#fff;--hi:#ffa300}
  :root[data-palette=foret][data-mode=light]{--accent:#1a7f4b;--on-accent:#fff;--head:#1a7f4b;--on-head:#fff;--hi:#f2c94c}
  :root[data-palette=foret][data-mode=dark]{--accent:#4cc38a;--on-accent:#07140d;--head:#12301f;--on-head:#fff;--hi:#f2c94c}
  :root[data-palette=atelier][data-mode=light]{--accent:#d9480f;--on-accent:#fff;--head:#222831;--on-head:#fff;--hi:#e8590c}
  :root[data-palette=atelier][data-mode=dark]{--accent:#ff9a5c;--on-accent:#1a0d04;--head:#14181d;--on-head:#fff;--hi:#e8590c}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:84px}
  header{background:var(--head);color:var(--on-head);border-bottom:4px solid var(--hi);padding:14px 16px 10px;padding-top:max(14px,env(safe-area-inset-top))}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .themebtn{border:0;background:rgba(255,255,255,.18);color:var(--on-head);width:38px;height:38px;border-radius:10px;font-size:1.1rem;cursor:pointer;flex:none}
  header h1{margin:0;font-size:1.15rem}
  header small{opacity:.85}
  .tabs{display:flex;gap:6px;margin-top:10px}
  .tab{flex:1;border:0;background:rgba(255,255,255,.18);color:var(--on-head);padding:9px 4px;border-radius:10px;font-size:.9rem;font-weight:600;cursor:pointer}
  .tab.active{background:var(--on-head);color:var(--head)}
  .tools{padding:12px 16px 0;display:grid;gap:8px}
  .tools input[type=search],.tools select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:1rem}
  .row{display:flex;gap:8px;align-items:center}
  .row{flex-wrap:wrap}
  .row select{flex:1 1 140px;min-width:0;font-size:.92rem;padding-right:4px}
  .row label{flex-basis:100%}
  .row label{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:.9rem}
  .count{padding:8px 16px 0;color:var(--muted);font-size:.85rem}
  .grid{display:grid;gap:10px;padding:10px 16px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:12px}
  .swatch{width:48px;height:48px;border-radius:50%;flex:none;border:2px solid var(--line);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
  .swatch.plate{border-radius:10px}
  .info{flex:1;min-width:0}
  .title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sub{color:var(--muted);font-size:.85rem;margin-top:2px}
  .qty{margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .qty b{font-size:1.05rem}
  .badge{font-size:.72rem;font-weight:700;color:#fff;border-radius:999px;padding:3px 9px}
  .badge.ok{background:var(--ok)} .badge.low{background:var(--low)} .badge.out{background:var(--out)}
  .bar{height:6px;background:var(--line);border-radius:6px;margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--ok)}
  .bar i.low{background:var(--low)} .bar i.out{background:var(--out)}
  .actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  button.small{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:6px 10px;font-size:.85rem;cursor:pointer}
  button.small.danger{color:var(--out)}
  .empty{padding:40px 16px;text-align:center;color:var(--muted)}
  footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 16px;padding-bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  footer .meta{color:var(--muted);font-size:.8rem}
  footer .meta a{color:inherit}
  .admin-bar{display:none;gap:6px;flex-wrap:wrap}
  body.admin .admin-bar{display:flex}
  .btn{border:0;background:var(--accent);color:var(--on-accent);border-radius:10px;padding:9px 14px;font-weight:600;font-size:.9rem;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  .btn:disabled{opacity:.45;cursor:default}
  .only-admin{display:none}
  body.admin .only-admin{display:flex}
  .draft{display:none;margin:10px 16px 0;padding:10px 12px;background:#fff4d6;color:#5c4400;border-radius:10px;font-size:.85rem}
  .draft.show{display:block}
  .draft button{margin-left:8px}
  #toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1c2430;color:#fff;padding:10px 16px;border-radius:10px;font-size:.9rem;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;text-align:center}
  #toast.show{opacity:1}
  dialog{border:0;border-radius:16px;padding:0;width:min(520px,94vw);background:var(--card);color:var(--text)}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  form.edit{padding:16px;display:grid;gap:10px}
  form.edit h2{margin:0 0 4px;font-size:1.1rem}
  form.edit p.help{margin:0;font-size:.82rem;color:var(--muted);line-height:1.4}
  form.edit p.err{margin:0;font-size:.85rem;color:var(--out);display:none}
  form.edit label{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
  form.edit input,form.edit select,form.edit textarea{padding:10px;border:1px solid var(--line);border-radius:8px;font-size:1rem;background:var(--bg);color:var(--text);width:100%}
  form.edit input[type=color]{padding:2px;height:42px}
  form.edit .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  form.edit .three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  form.edit .check{display:flex;align-items:center;gap:8px;color:var(--text)}
  form.edit .check input{width:auto}
  .palettes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
  .pal{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:8px;font-size:.85rem;cursor:pointer;text-align:left}
  .pal.sel{border-color:var(--accent)}
  .dot{width:26px;height:26px;border-radius:50%;flex:none;border:1px solid var(--line)}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .seg button{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:9px;font-size:.9rem;cursor:pointer}
  .seg button.sel{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  .dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
</style>
<script>
const THEME_KEY='fablab-theme';
const PAL={fablab:{n:'Bleu FabLab',a:'#1f6feb',h:'#f2994a'},am:{n:'Arts et Métiers',a:'#80276c',h:'#ffa300'},
  foret:{n:'Forêt',a:'#1a7f4b',h:'#f2c94c'},atelier:{n:'Atelier',a:'#222831',h:'#e8590c'},custom:{n:'Personnalisé',a:'#1f6feb',h:'#1f6feb'}};
function getTheme(){
  try{const t=JSON.parse(localStorage.getItem(THEME_KEY));
    if(t&&PAL[t.palette]) return {palette:t.palette,mode:['auto','light','dark'].includes(t.mode)?t.mode:'auto',custom:/^#[0-9a-f]{6}$/i.test(t.custom)?t.custom:'#1f6feb'};
  }catch(e){}
  return {palette:'fablab',mode:'auto',custom:'#1f6feb'};
}
function setTheme(t){ try{localStorage.setItem(THEME_KEY,JSON.stringify(t));}catch(e){} applyTheme(); }
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgb2hex=a=>'#'+a.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
const mix=(a,b,p)=>{const x=hex2rgb(a),y=hex2rgb(b);return rgb2hex(x.map((v,i)=>v*(1-p)+y[i]*p));};
const lumOf=h=>{const [r,g,b]=hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});return .2126*r+.7152*g+.0722*b;};
const onColor=h=>lumOf(h)>0.4?'#111111':'#ffffff';
function applyTheme(){
  const t=getTheme(), root=document.documentElement;
  const dark=t.mode==='dark'||(t.mode==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  root.dataset.mode=dark?'dark':'light'; root.dataset.palette=t.palette;
  ['--accent','--on-accent','--head','--on-head','--hi'].forEach(p=>root.style.removeProperty(p));
  if(t.palette==='custom'){
    const c=t.custom, acc=dark?mix(c,'#ffffff',0.35):c, head=dark?mix(c,'#10151c',0.6):c;
    root.style.setProperty('--accent',acc); root.style.setProperty('--on-accent',onColor(acc));
    root.style.setProperty('--head',head);  root.style.setProperty('--on-head',onColor(head));
    root.style.setProperty('--hi',acc);
  }
  const m=document.querySelector('meta[name=theme-color]');
  if(m) m.content=getComputedStyle(root).getPropertyValue('--head').trim()||'#1f6feb';
}
applyTheme();
if(window.matchMedia){ const mq=matchMedia('(prefers-color-scheme: dark)');
  const h=()=>{ if(getTheme().mode==='auto') applyTheme(); };
  if(mq.addEventListener) mq.addEventListener('change',h); }
</script>
</head>
<body>
<header>
  <div class="top"><h1>Stock du FabLab Clunisois</h1><button id="themeBtn" class="themebtn" type="button" aria-label="Changer le thème" title="Apparence">🎨</button></div>
  <small id="updated">Chargement…</small>
  <div class="tabs" id="tabs"></div>
</header>

<div class="draft" id="draft">Modifications non publiées.
  <button class="small" id="discardDraft">Annuler les modifications</button>
</div>

<div class="tools">
  <input type="search" id="q" placeholder="Rechercher (matériau, couleur, marque…)">
  <div class="row">
    <select id="material"></select>
    <select id="extra" style="display:none"></select>
    <label><input type="checkbox" id="onlyAvail"> Disponible</label>
  </div>
</div>
<div class="count" id="count"></div>
<main class="grid" id="list"></main>

<footer>
  <span class="meta" id="metaLeft"></span>
  <div class="admin-bar">
    <button class="btn" id="add">+ Ajouter</button>
    <button class="btn" id="publish" disabled>Publier</button>
    <button class="btn ghost" id="logout">Déconnexion</button>
  </div>
</footer>
<div id="toast"></div>

<!-- Fiche article -->
<dialog id="dlg">
  <form class="edit" id="form" method="dialog">
    <h2 id="dlgTitle">Article</h2>
    <label>Catégorie
      <select name="category">
        <option value="filament">Filaments pour FDM</option>
        <option value="resine">Résines pour Form 4</option>
        <option value="plaque">Plaques découpe laser</option>
      </select>
    </label>
    <div class="two">
      <label>Matériau / type <input name="material" list="materials" required placeholder="PLA, PETG, Standard…"></label>
      <label>Marque / nom <input name="name" placeholder="Prusament, Elegoo…"></label>
    </div>
    <label>Nom de la couleur <input name="colorName" placeholder="Rouge, Noir charbon, Bouleau…"></label>
    <div class="two">
      <label>Pastille <input type="color" name="color" value="#888888"></label>
      <label id="color2wrap" style="display:none">Pastille 2 <input type="color" name="color2" value="#ffffff"></label>
    </div>
    <label class="check"><input type="checkbox" name="bicolor"> Double couleur</label>
    <div class="two">
      <label><span id="qtyLabel">Quantité (g)</span> <input type="number" name="quantity" min="0" step="any" required></label>
      <label>Seuil « faible » <input type="number" name="low" min="0" step="any" placeholder="auto"></label>
    </div>
    <label id="diawrap">Diamètre (mm) <input type="number" name="diameter" min="0" step="any" placeholder="1.75"></label>
    <label id="packwrap">Conditionnement d'achat (<span id="packUnit">g</span> par unité) <input type="number" name="pack" min="0" step="any" placeholder="1000"></label>
    <div class="three" id="dims">
      <label>Longueur (mm) <input type="number" name="width" min="0" step="any"></label>
      <label>Largeur (mm) <input type="number" name="height" min="0" step="any"></label>
      <label>Épaisseur (mm) <input type="number" name="thickness" min="0" step="any"></label>
    </div>
    <label>Emplacement <input name="location" placeholder="Étagère A, bac 2…"></label>
    <label>Note <textarea name="note" rows="2"></textarea></label>
    <div class="dlg-actions">
      <button type="button" class="btn ghost" id="cancel">Annuler</button>
      <button class="btn" value="save">Enregistrer</button>
    </div>
  </form>
</dialog>

<!-- Connexion gestionnaire -->
<dialog id="dlgGh">
  <form class="edit" id="ghForm" autocomplete="off">
    <h2>Connexion gestionnaire</h2>
    <p class="help">Réservé au responsable du FabLab. Le jeton GitHub reste uniquement dans ce navigateur ; sans lui, il est impossible de modifier le stock.</p>
    <label>Dépôt GitHub <input name="repo" required placeholder="mon-compte/fablab-stock"></label>
    <label>Branche <input name="branch" placeholder="main"></label>
    <label>Jeton d'accès <input name="token" type="password" required autocomplete="off" placeholder="github_pat_…"></label>
    <p class="err" id="ghErr"></p>
    <div class="dlg-actions">
      <button type="button" class="btn ghost" id="ghCancel">Annuler</button>
      <button class="btn" id="ghOk">Se connecter</button>
    </div>
  </form>
</dialog>
<!-- Apparence -->
<dialog id="dlgTheme">
  <form class="edit" method="dialog">
    <h2>Apparence</h2>
    <div class="palettes" id="palettes"></div>
    <label id="customWrap" style="display:none">Couleur principale <input type="color" id="customColor" value="#1f6feb"></label>
    <div class="seg" id="modes"></div>
    <div class="dlg-actions"><button class="btn">Fermer</button></div>
  </form>
</dialog>
<datalist id="materials"></datalist>

<script>
const CATS = {
  filament:{label:'Filaments pour FDM', unit:'g',   low:200, step:1000, full:1000},
  resine:  {label:'Résines pour SLA',   unit:'mL',  low:250, step:1000, full:1000},
  plaque:  {label:'Plaques pour découpe laser', unit:'pcs', low:2, step:1, full:10}
};
const DRAFT_KEY='fablab-stock-draft';
const CFG_KEY='fablab-gh';
const state={data:{updated:'',items:[]},cat:'filament',q:'',material:'',extra:'',onlyAvail:false,
  admin:false,dirty:false,editId:null,sha:null,cfg:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('fr-FR',{maximumFractionDigits:2});
// Pas des boutons − / + : conditionnement d'achat (1000 g / 1000 mL par défaut, modifiable par article)
const packOf=it=>Number(it.pack)>0?Number(it.pack):CATS[it.category].step;

let toastTimer;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),4500);
}

/* ---------- GitHub (écriture réservée au détenteur du jeton) ---------- */
const getCfg=()=>{try{return JSON.parse(localStorage.getItem(CFG_KEY))||null;}catch(e){return null;}};
const toB64=s=>{const b=new TextEncoder().encode(s);let bin='';for(let i=0;i<b.length;i++)bin+=String.fromCharCode(b[i]);return btoa(bin);};
const fromB64=s=>{const bin=atob(s.replace(/\s/g,''));return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)));};
const gh=(cfg,path,opts={})=>fetch('https://api.github.com/repos/'+cfg.repo+path,{
  ...opts,
  headers:{'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Authorization':'Bearer '+cfg.token,...(opts.headers||{})}
});
function errMsg(e){
  const m=String(e&&e.message||e);
  if(m==='auth') return 'Jeton invalide, expiré ou sans accès à ce dépôt.';
  if(m==='notfound') return 'Dépôt ou fichier stock.json introuvable (vérifie le nom du dépôt et la branche).';
  if(m==='conflit') return 'Le stock a été modifié ailleurs entre-temps. Recharge la page : tes modifications sont gardées.';
  if(m==='write') return 'Ce jeton n\'a pas le droit d\'écrire (permission « Contents : Read and write » manquante).';
  return 'Erreur réseau ou GitHub ('+m+').';
}
async function fetchRemote(cfg){
  const r=await gh(cfg,'/contents/stock.json?ref='+encodeURIComponent(cfg.branch||'main')+'&t='+Date.now(),{cache:'no-store'});
  if(r.status===401||r.status===403) throw new Error('auth');
  if(r.status===404) throw new Error('notfound');
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json();
  return {data:JSON.parse(fromB64(j.content)),sha:j.sha};
}

/* ---------- chargement ---------- */
async function load(){
  state.cfg=getCfg(); state.admin=false; state.sha=null; state.dirty=false;
  let remote=null;
  if(state.cfg&&state.cfg.token){
    try{ remote=await fetchRemote(state.cfg); }
    catch(e){ toast(errMsg(e)); }
  }
  if(remote){
    state.data=remote.data; state.sha=remote.sha; state.admin=true;
    try{
      const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');
      if(d&&d.data){
        if(d.base===remote.sha||confirm('Le stock publié a changé depuis tes dernières modifications locales.\n\nOK = garder tes modifications locales\nAnnuler = repartir de la version publiée')){
          state.data=d.data; state.dirty=true;
        }else{
          localStorage.removeItem(DRAFT_KEY);
        }
      }
    }catch(e){}
  }else{
    try{
      const r=await fetch('stock.json?'+Date.now(),{cache:'no-store'});
      if(!r.ok) throw new Error(r.status);
      state.data=await r.json();
    }catch(e){
      $('updated').textContent='Impossible de charger stock.json';
    }
  }
  document.body.classList.toggle('admin',state.admin);
  render();
}

function saveDraft(){
  state.dirty=true;
  try{ localStorage.setItem(DRAFT_KEY,JSON.stringify({base:state.sha,data:state.data})); }catch(e){}
  render();
}

async function publish(){
  if(!state.admin||!state.dirty) return;
  const btn=$('publish'); btn.disabled=true; btn.textContent='Publication…';
  try{
    state.data.updated=new Date().toISOString();
    const body={
      message:'Mise à jour du stock',
      content:toB64(JSON.stringify(state.data,null,2)+'\n'),
      branch:state.cfg.branch||'main'
    };
    if(state.sha) body.sha=state.sha;
    const r=await gh(state.cfg,'/contents/stock.json',{method:'PUT',body:JSON.stringify(body)});
    if(r.status===409||r.status===422) throw new Error('conflit');
    if(r.status===401) throw new Error('auth');
    if(r.status===403||r.status===404) throw new Error('write');
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    state.sha=j.content.sha; state.dirty=false;
    try{localStorage.removeItem(DRAFT_KEY);}catch(e){}
    toast('Publié ✓ Visible par les étudiants dans environ 1 minute.');
  }catch(e){
    toast('Échec de la publication : '+errMsg(e));
  }finally{
    btn.textContent='Publier'; render();
  }
}

/* ---------- affichage ---------- */
function status(it){
  const c=CATS[it.category]; const q=Number(it.quantity)||0;
  const low=(it.low!==undefined&&it.low!==''&&it.low!==null)?Number(it.low):c.low;
  if(q<=0) return 'out';
  if(q<=low) return 'low';
  return 'ok';
}
const LABEL={ok:'Disponible',low:'Stock faible',out:'Épuisé'};

function swatch(it){
  const a=it.color||'#888';
  const bg=it.color2?`linear-gradient(135deg, ${esc(a)} 50%, ${esc(it.color2)} 50%)`:esc(a);
  return `<div class="swatch ${it.category==='plaque'?'plate':''}" style="background:${bg}"></div>`;
}

function dimsText(it){
  if(it.category!=='plaque') return '';
  const p=[];
  if(it.width&&it.height) p.push(`${fmt(it.width)}×${fmt(it.height)} mm`);
  if(it.thickness) p.push(`ép. ${fmt(it.thickness)} mm`);
  return p.join(' · ');
}

function render(){
  $('tabs').innerHTML=Object.entries(CATS).map(([k,c])=>
    `<button class="tab ${k===state.cat?'active':''}" data-cat="${k}">${c.label}</button>`).join('');
  $('updated').textContent=state.data.updated?('Mis à jour le '+new Date(state.data.updated).toLocaleDateString('fr-FR')):'';
  $('draft').classList.toggle('show',state.admin&&state.dirty);
  $('publish').disabled=!state.dirty;
  $('metaLeft').innerHTML=state.admin?'Connecté en gestionnaire':'<a href="#" id="loginLink">Connexion gestionnaire</a>';

  const inCat=state.data.items.filter(i=>i.category===state.cat);
  const mats=[...new Set(inCat.map(i=>i.material).filter(Boolean))].sort();
  const sel=$('material');
  sel.innerHTML='<option value="">Tous les matériaux</option>'+mats.map(m=>`<option ${m===state.material?'selected':''}>${esc(m)}</option>`).join('');
  if(state.material&&!mats.includes(state.material)) state.material='';
  const exKey=state.cat==='filament'?'diameter':state.cat==='plaque'?'thickness':null;
  const exSel=$('extra');
  if(exKey){
    const vals=[...new Set(inCat.map(i=>i[exKey]).filter(v=>v!==undefined&&v!==null&&v!==''))].sort((a,b)=>a-b);
    const none=exKey==='diameter'?'Tous les diamètres':'Toutes les épaisseurs';
    exSel.innerHTML=`<option value="">${none}</option>`+vals.map(v=>`<option value="${v}" ${String(v)===state.extra?'selected':''}>${exKey==='diameter'?'Ø ':'ép. '}${fmt(v)} mm</option>`).join('');
    if(state.extra&&!vals.map(String).includes(state.extra)) state.extra='';
    exSel.style.display='';
  }else{ exSel.style.display='none'; state.extra=''; }
  $('materials').innerHTML=[...new Set(state.data.items.map(i=>i.material).filter(Boolean))].sort().map(m=>`<option value="${esc(m)}">`).join('');

  const q=state.q.trim().toLowerCase();
  let items=inCat.filter(i=>{
    if(state.material&&i.material!==state.material) return false;
    if(state.onlyAvail&&status(i)==='out') return false;
    if(exKey&&state.extra&&String(i[exKey])!==state.extra) return false;
    if(q){
      const hay=[i.material,i.name,i.colorName,i.location,i.note].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b)=>(a.material||'').localeCompare(b.material||'','fr')
    ||((a.diameter||0)-(b.diameter||0))
    ||(a.colorName||'').localeCompare(b.colorName||'','fr')
    ||((a.thickness||0)-(b.thickness||0))
    ||(((b.width||0)*(b.height||0))-((a.width||0)*(a.height||0)))
    ||(a.name||'').localeCompare(b.name||'','fr'));

  $('count').textContent=`${items.length} article${items.length>1?'s':''}`;
  if(!items.length){ $('list').innerHTML='<div class="empty">Aucun article.</div>'; return; }

  $('list').innerHTML=items.map(it=>{
    const c=CATS[it.category]; const st=status(it);
    const pct=Math.max(0,Math.min(100,(Number(it.quantity)||0)/c.full*100));
    const dims=dimsText(it);
    return `<article class="card">
      ${swatch(it)}
      <div class="info">
        <div class="title">${esc(it.material)}${it.colorName?' · '+esc(it.colorName):''}</div>
        <div class="sub">${[it.name&&esc(it.name),it.diameter&&('Ø '+fmt(it.diameter)+' mm'),dims,it.location&&('📍 '+esc(it.location))].filter(Boolean).join(' · ')}</div>
        ${it.note?`<div class="sub">${esc(it.note)}</div>`:''}
        <div class="qty"><b>${fmt(it.quantity||0)} ${c.unit}</b><span class="badge ${st}">${LABEL[st]}</span></div>
        ${it.category!=='plaque'?`<div class="bar"><i class="${st}" style="width:${pct}%"></i></div>`:''}
        <div class="actions only-admin">
          <button class="small" data-act="minus" data-id="${esc(it.id)}">− ${fmt(packOf(it))}</button>
          <button class="small" data-act="plus" data-id="${esc(it.id)}">+ ${fmt(packOf(it))}</button>
          <button class="small" data-act="edit" data-id="${esc(it.id)}">Modifier</button>
          <button class="small danger" data-act="del" data-id="${esc(it.id)}">Suppr.</button>
        </div>
      </div>
    </article>`;
  }).join('');
}

/* ---------- événements ---------- */
$('tabs').addEventListener('click',e=>{
  const b=e.target.closest('[data-cat]'); if(!b) return;
  state.cat=b.dataset.cat; state.material=''; state.extra=''; render();
});
$('q').addEventListener('input',e=>{state.q=e.target.value;render();});
$('material').addEventListener('change',e=>{state.material=e.target.value;render();});
$('extra').addEventListener('change',e=>{state.extra=e.target.value;render();});
$('onlyAvail').addEventListener('change',e=>{state.onlyAvail=e.target.checked;render();});

$('discardDraft').addEventListener('click',()=>{
  if(!confirm('Abandonner toutes les modifications non publiées ?')) return;
  try{localStorage.removeItem(DRAFT_KEY);}catch(e){}
  load();
});

$('list').addEventListener('click',e=>{
  if(!state.admin) return;
  const b=e.target.closest('[data-act]'); if(!b) return;
  const it=state.data.items.find(i=>i.id===b.dataset.id); if(!it) return;
  const step=packOf(it);
  if(b.dataset.act==='minus'){ it.quantity=Math.max(0,(Number(it.quantity)||0)-step); saveDraft(); }
  if(b.dataset.act==='plus'){ it.quantity=(Number(it.quantity)||0)+step; saveDraft(); }
  if(b.dataset.act==='edit') openDialog(it);
  if(b.dataset.act==='del'){
    if(confirm('Supprimer cet article ?')){
      state.data.items=state.data.items.filter(i=>i.id!==it.id); saveDraft();
    }
  }
});

$('publish').addEventListener('click',publish);
$('logout').addEventListener('click',()=>{
  if(state.dirty&&!confirm('Des modifications ne sont pas publiées. Se déconnecter et les perdre ?')) return;
  try{localStorage.removeItem(CFG_KEY);localStorage.removeItem(DRAFT_KEY);}catch(e){}
  load();
});

/* ---------- connexion gestionnaire ---------- */
const ghForm=$('ghForm');
function guessRepo(){
  const h=location.hostname, p=location.pathname.split('/')[1];
  return (h.endsWith('.github.io')&&p)?h.split('.')[0]+'/'+p:'';
}
function openGh(){
  const c=getCfg()||{};
  ghForm.repo.value=c.repo||guessRepo();
  ghForm.branch.value=c.branch||'main';
  ghForm.token.value='';
  $('ghErr').style.display='none';
  $('dlgGh').showModal();
}
$('metaLeft').addEventListener('click',e=>{
  if(e.target.id==='loginLink'){ e.preventDefault(); openGh(); }
});
$('ghCancel').addEventListener('click',()=>$('dlgGh').close());
ghForm.addEventListener('submit',async e=>{
  e.preventDefault();
  const cfg={repo:ghForm.repo.value.trim(),branch:ghForm.branch.value.trim()||'main',token:ghForm.token.value.trim()};
  const err=$('ghErr'); const ok=$('ghOk');
  ok.disabled=true; ok.textContent='Vérification…'; err.style.display='none';
  try{
    const rr=await gh(cfg,'');
    if(rr.status===401||rr.status===403) throw new Error('auth');
    if(rr.status===404) throw new Error('notfound');
    if(!rr.ok) throw new Error('HTTP '+rr.status);
    const info=await rr.json();
    if(info.permissions&&info.permissions.push===false) throw new Error('write');
    await fetchRemote(cfg);
    localStorage.setItem(CFG_KEY,JSON.stringify(cfg));
    $('dlgGh').close();
    await load();
    toast('Connecté. Tu peux modifier le stock puis cliquer sur Publier.');
  }catch(ex){
    err.textContent=errMsg(ex); err.style.display='block';
  }finally{
    ok.disabled=false; ok.textContent='Se connecter';
  }
});

/* ---------- apparence ---------- */
function renderThemeDlg(){
  const t=getTheme();
  $('palettes').innerHTML=Object.entries(PAL).map(([k,p])=>{
    const a=k==='custom'?t.custom:p.a, h=k==='custom'?t.custom:p.h;
    return `<button type="button" class="pal ${k===t.palette?'sel':''}" data-pal="${k}"><span class="dot" style="background:linear-gradient(135deg,${a} 50%,${h} 50%)"></span>${p.n}</button>`;
  }).join('');
  $('customWrap').style.display=t.palette==='custom'?'grid':'none';
  $('customColor').value=t.custom;
  $('modes').innerHTML=[['auto','Auto'],['light','Clair'],['dark','Sombre']]
    .map(([k,l])=>`<button type="button" class="${k===t.mode?'sel':''}" data-mode="${k}">${l}</button>`).join('');
}
$('themeBtn').addEventListener('click',()=>{ renderThemeDlg(); $('dlgTheme').showModal(); });
$('palettes').addEventListener('click',e=>{
  const b=e.target.closest('[data-pal]'); if(!b) return;
  const t=getTheme(); t.palette=b.dataset.pal; setTheme(t); renderThemeDlg();
});
$('modes').addEventListener('click',e=>{
  const b=e.target.closest('[data-mode]'); if(!b) return;
  const t=getTheme(); t.mode=b.dataset.mode; setTheme(t); renderThemeDlg();
});
$('customColor').addEventListener('input',e=>{
  const t=getTheme(); t.palette='custom'; t.custom=e.target.value; setTheme(t);
  document.querySelectorAll('.pal').forEach(b=>b.classList.toggle('sel',b.dataset.pal==='custom'));
  const d=document.querySelector('[data-pal=custom] .dot'); if(d) d.style.background=`linear-gradient(135deg,${t.custom} 50%,${t.custom} 50%)`;
});

/* ---------- fiche article ---------- */
const form=$('form');
function syncForm(){
  const cat=form.category.value;
  $('qtyLabel').textContent=`Quantité (${CATS[cat].unit})`;
  $('dims').style.display=cat==='plaque'?'grid':'none';
  $('packwrap').style.display=cat==='plaque'?'none':'grid';
  $('diawrap').style.display=cat==='filament'?'grid':'none';
  $('packUnit').textContent=CATS[cat].unit;
  $('color2wrap').style.display=form.bicolor.checked?'grid':'none';
}
form.category.addEventListener('change',syncForm);
form.bicolor.addEventListener('change',syncForm);

function openDialog(it){
  state.editId=it?it.id:null;
  $('dlgTitle').textContent=it?'Modifier l\'article':'Nouvel article';
  form.reset();
  form.category.value=it?.category||state.cat;
  form.material.value=it?.material||'';
  form.name.value=it?.name||'';
  form.colorName.value=it?.colorName||'';
  form.diameter.value=it?.diameter??'';
  form.color.value=it?.color||'#888888';
  form.bicolor.checked=!!it?.color2;
  form.color2.value=it?.color2||'#ffffff';
  form.quantity.value=it?.quantity??'';
  form.low.value=it?.low??'';
  form.pack.value=it?.pack??'';
  form.width.value=it?.width??'';
  form.height.value=it?.height??'';
  form.thickness.value=it?.thickness??'';
  form.location.value=it?.location||'';
  form.note.value=it?.note||'';
  syncForm();
  $('dlg').showModal();
}
$('add').addEventListener('click',()=>openDialog(null));
$('cancel').addEventListener('click',()=>$('dlg').close());
form.addEventListener('submit',()=>{
  const num=v=>v===''?undefined:Number(v);
  const obj={
    id:state.editId||('i'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)),
    category:form.category.value,
    material:form.material.value.trim(),
    name:form.name.value.trim()||undefined,
    colorName:form.colorName.value.trim()||undefined,
    color:form.color.value,
    color2:form.bicolor.checked?form.color2.value:undefined,
    quantity:Number(form.quantity.value)||0,
    low:num(form.low.value),
    location:form.location.value.trim()||undefined,
    note:form.note.value.trim()||undefined
  };
  if(obj.category==='plaque'){
    obj.width=num(form.width.value); obj.height=num(form.height.value); obj.thickness=num(form.thickness.value);
  }else{
    obj.pack=num(form.pack.value);
    if(obj.category==='filament') obj.diameter=num(form.diameter.value);
  }
  const clean=JSON.parse(JSON.stringify(obj)); // retire les undefined
  const idx=state.data.items.findIndex(i=>i.id===clean.id);
  if(idx>=0) state.data.items[idx]=clean; else state.data.items.push(clean);
  state.cat=clean.category;
  saveDraft();
});

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
load();
</script>
</body>
